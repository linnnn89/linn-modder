[project]
name = "linn-modder"
version = "0.3.0"
description = "Tools and a shared knowledge base for AI agents that mod games: engine scanner, fal asset generation, sprite and 3D-to-sprite pipelines, window capture and input on Windows, showcase video editing, field notes."
readme = "README.md"
license = "MIT"
requires-python = ">=3.10"
dependencies = [
    "pillow>=10",
    "numpy>=1.24",
    "pyyaml>=6",
]

[project.optional-dependencies]
mcp = ["mcp>=1.29,<2"]
dev = ["pytest>=8", "build>=1.2", "hatchling>=1.27"]

[project.scripts]
um = "um.cli:main"
linn-modder = "um.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["um"]

[tool.hatch.build.targets.wheel.force-include]
"skills" = "um/data/skills"
"knowledge" = "um/data/knowledge"

[tool.hatch.build.targets.sdist]
only-include = ["um", "skills", "knowledge", "tests", "scripts", "docs", "bin", "README.md", "AGENTS.md", "LICENSE", "pyproject.toml"]
